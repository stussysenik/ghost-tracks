# Matcher service config.
#
# Dev secret only — this service is internal (called by the SvelteKit /api/route proxy),
# never exposed publicly. Override in any real deployment.
play.http.secret.key = "matcher-dev-secret-please-override-32chars-min-0001"

# Eagerly build/load the GraphHopper graph at boot (see app/Module.scala) so the first
# /match request isn't slowed by graph import.
matcher {
  # Local OSM extract — see scripts/fetch-osm.sh. Override with MATCHER_OSM_FILE.
  osmFile = "data/Prague.osm.pbf"
  osmFile = ${?MATCHER_OSM_FILE}

  # GraphHopper builds a routing graph here on first run, then loads the cache after.
  graphCache = "data/graph-cache"

  # Routing profile. "foot" matches the existing Mapbox walking profile.
  profile = "foot"

  # Map-matching tolerance (meters). This is the shape-fidelity ↔ road-snapping knob:
  # larger = snaps more aggressively to roads; smaller = hugs the drawn shape.
  measurementErrorSigma = 40
}
